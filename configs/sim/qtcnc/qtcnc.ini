[EMC]
VERSION = 1.1
MACHINE = LinuxCNC-HAL-SIM-QTCNC
DEBUG = 0

[DISPLAY]
DISPLAY = qtcnc
TITLE = qtcnc 500x500x50 sim
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 60.0
DEFAULT_LINEAR_VELOCITY = 50.0
INCREMENTS = 10 mm, 1.0 mm, 0.10 mm, 0.01 mm
PROGRAM_PREFIX = ../../nc_files/

[QTCNC]
SCREEN = minimal
TOOL_DB = tools.db

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = qtcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = qtcnc.tbl
DB_PROGRAM = ./db_program.py
TOOL_CHANGE_POSITION = 0 0 0
TOOL_CHANGE_QUILL_UP = 1

[HAL]
HALFILE = core_sim.hal
HALFILE = sim_spindle_encoder.hal
HALFILE = simulated_home.hal
POSTGUI_HALFILE = postgui.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 60.0
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_ACCELERATION = 500.0
DEFAULT_LINEAR_ACCELERATION = 500.0
POSITION_FILE = position.txt

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -254
MAX_LIMIT = 254
MAX_VELOCITY = 60.0
MAX_ACCELERATION = 500.0

[AXIS_Y]
MIN_LIMIT = -254
MAX_LIMIT = 254
MAX_VELOCITY = 60.0
MAX_ACCELERATION = 500.0

[AXIS_Z]
MIN_LIMIT = -50.8
MAX_LIMIT = 101.6
MAX_VELOCITY = 40.0
MAX_ACCELERATION = 500.0

[JOINT_0]
AXIS = X
TYPE = LINEAR
MIN_LIMIT = -254
MAX_LIMIT = 254
MAX_VELOCITY = 60.0
MAX_ACCELERATION = 500.0
BACKLASH = 0.000
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
FERROR = 1.0
MIN_FERROR = 0.5
HOME = 0.000
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 10.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

[JOINT_1]
AXIS = Y
TYPE = LINEAR
MIN_LIMIT = -254
MAX_LIMIT = 254
MAX_VELOCITY = 60.0
MAX_ACCELERATION = 500.0
BACKLASH = 0.000
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
FERROR = 1.0
MIN_FERROR = 0.5
HOME = 0.000
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 10.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 2

[JOINT_2]
AXIS = Z
TYPE = LINEAR
MIN_LIMIT = -50.8
MAX_LIMIT = 101.6
MAX_VELOCITY = 40.0
MAX_ACCELERATION = 500.0
BACKLASH = 0.000
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
FERROR = 1.0
MIN_FERROR = 0.5
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 10.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
